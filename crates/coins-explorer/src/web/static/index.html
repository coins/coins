<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coins Explorer</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@0.9.4/css/bulma.min.css">
    <link rel="stylesheet" href="/shared/coins-common.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
</head>
<body>
    <!-- Floating status indicator -->
    <div class="status-indicator" id="status-indicator">
        <div class="status-dot" id="connection-dot"></div>
    </div>

    <!-- Global Search Bar -->
    <div class="explorer-search-bar">
        <div class="container">
            <div class="explorer-search-wrapper">
                <input class="search-input" type="text" id="global-search"
                       placeholder="Search by address or block height..."
                       onkeypress="if(event.key==='Enter')app.globalSearch()">
                <div class="explorer-search-error" id="global-search-error"></div>
            </div>
        </div>
    </div>

    <!-- Main Content -->
    <section class="section" style="padding-top: 1rem;">
        <div class="container">
            <div id="content">
                <!-- Dynamic content loaded here -->
            </div>
        </div>
    </section>

    <script src="/app.js?v=44"></script>
</body>
</html>
