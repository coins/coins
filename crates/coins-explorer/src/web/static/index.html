<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coins Explorer</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@0.9.4/css/bulma.min.css">
    <link rel="stylesheet" href="/shared/coins-common.css">
    <link rel="stylesheet" href="/explorer.css?v=51">
</head>
<body>
    <!-- Main Content -->
    <section class="section">
        <div class="explorer-container">
            <!-- Header with search -->
            <div class="explorer-header">
                <div class="explorer-brand" onclick="app.showSection('overview')" style="cursor: pointer;">
                    <span class="brand-icon">&#9670;</span>
                    <span class="brand-text">Coins Explorer</span>
                    <div class="status-indicator" id="status-indicator">
                        <span class="status-dot" id="connection-dot"></span>
                        <div class="status-tooltip-content" id="status-tooltip">
                            <div class="tooltip-row">
                                <span class="tooltip-service">Indexer</span>
                                <span class="tooltip-status">
                                    <span class="tooltip-dot" id="indexer-status-dot"></span>
                                    <span id="indexer-status-text">Checking...</span>
                                </span>
                            </div>
                            <div class="tooltip-row">
                                <span class="tooltip-service">Publisher</span>
                                <span class="tooltip-status">
                                    <span class="tooltip-dot" id="publisher-status-dot"></span>
                                    <span id="publisher-status-text">Checking...</span>
                                </span>
                            </div>
                            <div class="tooltip-row">
                                <span class="tooltip-service">WebSocket</span>
                                <span class="tooltip-status">
                                    <span class="tooltip-dot" id="ws-status-dot"></span>
                                    <span id="ws-status-text">Connecting...</span>
                                </span>
                            </div>
                            <div class="tooltip-divider"></div>
                            <div class="tooltip-row">
                                <span class="tooltip-service">Next Block</span>
                                <span class="tooltip-status">
                                    <span id="next-block-text">--</span>
                                </span>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="explorer-search">
                    <div class="search-container" id="search-container">
                        <div class="search-input-wrapper">
                            <span class="search-prefix">/</span>
                            <input class="search-input" type="text" id="global-search"
                                   placeholder="Search blocks, accounts, transactions..."
                                   autocomplete="off" spellcheck="false">
                            <span class="search-shortcut"><kbd>/</kbd></span>
                        </div>
                        <div class="search-results" id="search-results"></div>
                    </div>
                </div>
            </div>

            <!-- Publisher Funding Warning -->
            <div id="publisher-funding-warning"></div>

            <!-- Stats Strip -->
            <div class="stats-strip" id="stats-strip">
                <div class="stat-item clickable" onclick="app.showSection('blocks')">
                    <span class="stat-value" data-stat="total-blocks">--</span>
                    <span class="stat-label">Blocks</span>
                </div>
                <div class="stat-item">
                    <span class="stat-value" data-stat="total-accounts">--</span>
                    <span class="stat-label">Accounts</span>
                </div>
                <div class="stat-item clickable" onclick="app.showSection('mempool')">
                    <span class="stat-value" data-stat="pending-txs">--</span>
                    <span class="stat-label">Pending</span>
                </div>
            </div>

            <!-- Main Content Area -->
            <div class="explorer-content" id="content">
                <!-- Overview Section -->
                <div class="explorer-section active" id="section-overview">
                    <div class="section-inner">
                        <h2 class="section-title">Latest Block</h2>
                        <div id="latest-block-card">
                            <div class="loading-placeholder">Loading...</div>
                        </div>
                    </div>
                </div>

                <!-- Blocks Section -->
                <div class="explorer-section" id="section-blocks">
                    <div class="section-inner">
                        <h2 class="section-title">All Blocks</h2>
                        <div id="blocks-list">
                            <div class="loading-placeholder">Loading...</div>
                        </div>
                    </div>
                </div>

                <!-- Mempool Section -->
                <div class="explorer-section" id="section-mempool">
                    <div class="section-inner">
                        <h2 class="section-title">Pending Transactions</h2>
                        <div id="mempool-content">
                            <div class="loading-placeholder">Loading...</div>
                        </div>
                    </div>
                </div>

                <!-- Block Detail Section -->
                <div class="explorer-section" id="section-block-detail">
                    <div class="section-inner">
                        <button class="back-btn" onclick="app.goBack()">
                            <span>&#8592;</span> Back
                        </button>
                        <div id="block-detail-content">
                            <div class="loading-placeholder">Loading...</div>
                        </div>
                    </div>
                </div>

                <!-- Account Detail Section -->
                <div class="explorer-section" id="section-account-detail">
                    <div class="section-inner">
                        <button class="back-btn" onclick="app.goBack()">
                            <span>&#8592;</span> Back
                        </button>
                        <div id="account-detail-content">
                            <div class="loading-placeholder">Loading...</div>
                        </div>
                    </div>
                </div>

                <!-- Transaction Detail Section -->
                <div class="explorer-section" id="section-tx-detail">
                    <div class="section-inner">
                        <button class="back-btn" onclick="app.goBack()">
                            <span>&#8592;</span> Back
                        </button>
                        <div id="tx-detail-content">
                            <div class="loading-placeholder">Loading...</div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <script src="/app.js?v=99"></script>
</body>
</html>
