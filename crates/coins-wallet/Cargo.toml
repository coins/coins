[package]
name = "coins-wallet"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "coins-wallet"
path = "src/main.rs"

[dependencies]
# Internal crates
coins-types = { path = "../coins-types" }
coins-crypto = { path = "../coins-crypto" }

# Web framework
axum = { version = "0.7", features = ["json", "macros", "ws"] }
tower = "0.5"
tower-http = { version = "0.5", features = ["fs", "cors", "trace"] }
futures = "0.3"

# Async runtime
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync"] }

# HTTP client (for proxying to indexer/publisher)
reqwest = { version = "0.11", default-features = false, features = ["json", "rustls-tls"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"

# Utilities
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
