[package]
name = "coins-client"
version = "0.1.0"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json"] }
coins-crypto = { path = "../coins-crypto" }
coins-types = { path = "../coins-types" }
hex = "0.4"
serde_json = "1"
anyhow = "1"
rand = "0.8"
ark-bn254 = "0.4.0"
ark-ff = "0.4.0"
bincode = "2.0.0-rc.3"
ark-ec = "0.4.2"
