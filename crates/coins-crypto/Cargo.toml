[package]
name = "coins-crypto"
version = "0.1.0"
edition = "2024"

[dependencies]
ark-ec = "0.4"
ark-ff = "0.4"
ark-std = { version = "0.4" }
ark-serialize = "0.4"
ark-bn254 = "0.4"
blake2 = "0.10"
sha2 = "0.10"
bn254_hash2curve = { version = "0.1.2", features = ["gnark_crypto_compatible"] }
rand = "0.8"
hex = "0.4"
serde = { version = "1", features = ["derive" ] } 