[package]
name = "coins-indexer"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "coins-indexer"
path = "src/main.rs"

[dependencies]
coins-types = { path = "../coins-types" }
coins-crypto = { path = "../coins-crypto" }
coins-core = { path = "../coins-core" }
coins-subchain = { path = "../coins-subchain" }
coins-bitcoin-rpc = { path = "../coins-bitcoin-rpc" }
sled = "0.34"
bitcoin = { version = "0.32", features = ["serde"] }
thiserror = "1"
serde = { version = "1", features = ["derive"] }
bincode = { version = "2.0.1", features = ["serde"] }
tracing = "0.1"
anyhow = "1"

# HTTP server dependencies
axum = "0.7"
tokio = { version = "1", features = ["full"] }
tower = "0.4"
tower-http = { version = "0.5", features = ["cors", "trace"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# HTTP client dependencies
reqwest = { version = "0.11", features = ["json"] }

# Configuration
toml = "0.8"
hex = "0.4"

[dev-dependencies]
tempfile = "3"
