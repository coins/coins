[package]
name = "coins-indexer"
version = "0.1.0"
edition = "2024"

[dependencies]
coins-types = { path = "../coins-types" }
coins-crypto = { path = "../coins-crypto" }
coins-state = { path = "../coins-state" }
coins-validator = { path = "../coins-validator" }
sled = "0.34"
bitcoin = { version = "0.32", features = ["serde"] }
thiserror = "1"
serde = { version = "1", features = ["derive"] }
bincode = { version = "2.0.1", features = ["serde"] }
tracing = "0.1"
anyhow = "1"

[dev-dependencies]
tempfile = "3"
