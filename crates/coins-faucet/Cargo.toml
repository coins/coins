[package]
name = "coins-faucet"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "coins-faucet"
path = "src/main.rs"

[dependencies]
# Internal crates
coins-types = { path = "../coins-types" }
coins-crypto = { path = "../coins-crypto" }

# BLS cryptography (for secret key parsing)
ark-ff = "0.4"
ark-bn254 = "0.4"

# Web framework
axum = { version = "0.7", features = ["json", "macros"] }
tower = "0.5"
tower-http = { version = "0.5", features = ["fs", "cors", "trace"] }

# Async runtime
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync"] }

# HTTP client (for calling indexer/publisher)
reqwest = { version = "0.11", default-features = false, features = ["json", "rustls-tls"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"
bincode = { version = "2.0.1", features = ["serde"] }

# Configuration
toml = "0.8"
clap = { version = "4", features = ["derive"] }

# Utilities
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
