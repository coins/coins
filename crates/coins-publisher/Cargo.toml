[package]
name = "coins-publisher"
version = "0.1.0"
edition = "2024"

[dependencies]
coins-subchain = { path = "../coins-subchain" }
coins-bitcoin-rpc = { path = "../coins-bitcoin-rpc" }
bitcoin = { version = "0.32", features=["serde"] }
tokio = { version = "1", features=["rt-multi-thread","macros","time","sync"] }
clap = { version = "4", features=["derive"] }
serde = { version = "1", features=["derive"] }
anyhow = "1"
axum = { version = "0.7", features=["json","macros"] }
serde_json = "1"
hex = "0.4"
coins-types = { path = "../coins-types" }
coins-core = { path = "../coins-core" }
coins-indexer = { path = "../coins-indexer" }
thiserror = "1"
rand = "0.8"
toml = "0.8"
coins-crypto = { path = "../coins-crypto" }
bincode = { version = "2.0.1", features = ["serde"] }
ark-ec = "0.4"
ark-ff = "0.4"
ark-bn254 = "0.4"
ark-serialize = "0.4"
reqwest = { version = "0.12", features = ["json", "rustls-tls", "blocking"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

[[bin]]
name = "coins-publisher"
path = "src/main.rs"

[dev-dependencies]
tokio = { version = "1", features=["macros","rt"] }
tower = { version = "0.5", features=["util"] }
axum = { version = "0.7", features=["json","macros"] }
tempfile = "3"
wiremock = "0.6"
http-body-util = "0.1" 