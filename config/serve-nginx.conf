worker_processes 1;
pid SERVE_DATA_DIR/nginx.pid;
error_log SERVE_DATA_DIR/nginx-error.log;

events {
    worker_connections 1024;
}

http {
    include       NGINX_MIME_TYPES;
    default_type  application/octet-stream;

    access_log SERVE_DATA_DIR/nginx-access.log;

    # Temp paths (so nginx doesn't need /var)
    client_body_temp_path SERVE_DATA_DIR/tmp/client_body;
    proxy_temp_path       SERVE_DATA_DIR/tmp/proxy;
    fastcgi_temp_path     SERVE_DATA_DIR/tmp/fastcgi;
    uwsgi_temp_path       SERVE_DATA_DIR/tmp/uwsgi;
    scgi_temp_path        SERVE_DATA_DIR/tmp/scgi;

    sendfile on;
    keepalive_timeout 65;

    # Needed for sub_filter to work on proxied responses
    proxy_set_header Accept-Encoding "";

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    server {
        listen 80;
        listen 443 ssl;
        server_name _;

        ssl_certificate     SERVE_DATA_DIR/ssl/server.crt;
        ssl_certificate_key SERVE_DATA_DIR/ssl/server.key;

        # Redirect root to wallet
        location = / {
            return 302 /wallet/;
        }

        # ── Wallet (/wallet/) → localhost:10001 ──
        location /wallet/ {
            proxy_pass http://127.0.0.1:10001/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Rewrite absolute paths in HTML/JS responses
            sub_filter_once off;
            sub_filter_types text/html application/javascript text/javascript;

            # HTML: stylesheet and script references
            sub_filter 'href="/shared/' 'href="/wallet/shared/';
            sub_filter 'src="/js/'      'src="/wallet/js/';

            # JS: WASM module import
            sub_filter "'/wasm/"  "'/wallet/wasm/";

            # JS: API fetch calls (template literals and string literals)
            sub_filter '`/api/' '`/wallet/api/';
            sub_filter "'/api/" "'/wallet/api/";

            # JS: WebSocket path
            sub_filter '{host}/ws' '{host}/wallet/ws';
        }

        # Wallet WebSocket
        location /wallet/ws {
            proxy_pass http://127.0.0.1:10001/ws;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_read_timeout 86400;
        }

        # ── Explorer (/explorer/) → localhost:10002 ──
        location /explorer/ {
            proxy_pass http://127.0.0.1:10002/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Rewrite absolute paths in HTML/JS responses
            sub_filter_once off;
            sub_filter_types text/html application/javascript text/javascript;

            # HTML: stylesheet references
            sub_filter 'href="/shared/'    'href="/explorer/shared/';
            sub_filter 'href="/explorer.css' 'href="/explorer/explorer.css';

            # HTML: script reference
            sub_filter 'src="/app.js' 'src="/explorer/app.js';

            # JS: API base path
            sub_filter "'/api/"  "'/explorer/api/";
            sub_filter '`/api/' '`/explorer/api/';

            # JS: WebSocket path
            sub_filter '{host}/ws' '{host}/explorer/ws';
        }

        # Explorer WebSocket
        location /explorer/ws {
            proxy_pass http://127.0.0.1:10002/ws;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_read_timeout 86400;
        }

        # ── Faucet (/faucet/) → localhost:10005 ──
        location /faucet/ {
            proxy_pass http://127.0.0.1:10005/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Rewrite absolute paths in HTML/JS responses
            sub_filter_once off;
            sub_filter_types text/html application/javascript text/javascript;

            # HTML: stylesheet references
            sub_filter 'href="/shared/' 'href="/faucet/shared/';

            # JS: API fetch calls
            sub_filter "'/api/" "'/faucet/api/";
            sub_filter '`/api/' '`/faucet/api/';
        }
    }
}
