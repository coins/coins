# Publisher configuration for regtest (local testing)
# Copy to ../publisher.toml and adjust as needed

# Bitcoin RPC configuration (required for regtest)
rpc_url = "http://localhost:18443"
rpc_user = "user"
rpc_pass = "password"
rpc_wallet = "coins-publisher"  # Watch-only wallet name

# Subchain file (relative to project root, network-isolated)
subchain = ".data/regtest/subchains/subchain_regtest.bin"

# Bitcoin secret key for fee payments (will be created if doesn't exist, network-isolated)
keyfile = ".data/regtest/keys/publisher_sk.hex"

# Mining interval in seconds
interval = 30

# Bitcoin network
network = "regtest"

# Indexer API URL (replaces direct database access)
indexer_url = "http://localhost:8084"

# API server port (network-specific to avoid conflicts)
api_port = 8080

# Publishing configuration
# Format: "op_return" (default), "taproot_annex", or "dual"
# - op_return: Standard relay, higher fees (proven, works everywhere)
# - taproot_annex: 75% cheaper fees via witness discount (may need custom relay)
# - dual: Broadcast both formats simultaneously (optimistic, 2x cost)
publish_format = "op_return"

# Fee rate in satoshis per virtual byte (default: 4)
fee_rate_sat_per_vb = 4

# For dual mode only: which format to track as primary anchor
# Options: "op_return" or "taproot_annex" (default: "op_return")
# dual_primary = "op_return"
