# Coins Block Explorer Configuration (Regtest)

[database]
# Path to publisher's state database (read-only, network-specific)
state_db = ".data/regtest/state.db"

# Path to publisher's indexer database (read-only, network-specific)
indexer_db = ".data/regtest/indexer.db"

# Path to explorer's transaction index database (read-write, explorer-specific, network-isolated)
tx_index_db = ".data/regtest/explorer-tx-index.db"

[bitcoin]
# Bitcoin RPC connection settings
rpc_url = "http://localhost:18443"
rpc_user = "user"
rpc_pass = "password"
network = "regtest"

[server]
# Port for the explorer API and web UI
api_port = 3000

# Host to bind to
host = "0.0.0.0"

# CORS allowed origins (empty = allow all)
cors_origins = []

[cache]
# Enable in-memory caching
enabled = true

# Number of blocks to keep in cache
block_cache_size = 1000

# Account cache time-to-live in seconds
account_cache_ttl_seconds = 60

# Bitcoin data cache time-to-live in seconds
bitcoin_cache_ttl_seconds = 10

[updates]
# Interval for checking new blocks (seconds)
poll_interval_seconds = 5

# Batch size for initial indexing
index_batch_size = 100
