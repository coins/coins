# Faucet configuration for production serve environment

[faucet]
# Path to the genesis secret key file
secret_key_file = ".data/serve/keys/genesis_sk.hex"
# Amount of tokens to dispense per claim
amount_per_claim = 1000
# Cooldown period between claims (in seconds)
cooldown_seconds = 60

[server]
# Port to listen on (10005 for serve environment)
port = 10005
# Host to bind to
host = "127.0.0.1"

[services]
# Indexer service URL (serve port)
indexer_url = "http://localhost:10003"
# Publisher service URL (serve port)
publisher_url = "http://localhost:10004"
# Explorer URL (user-facing, for linking from the faucet UI)
explorer_url = "/explorer"
