# Faucet configuration for regtest network

[faucet]
# Path to the genesis secret key file
secret_key_file = ".data/regtest/keys/genesis_sk.hex"
# Amount of tokens to dispense per claim
amount_per_claim = 1000
# Cooldown period between claims (in seconds)
cooldown_seconds = 10

[server]
# Port to listen on
port = 8086
# Host to bind to
host = "127.0.0.1"

[services]
# Indexer service URL
indexer_url = "http://localhost:8084"
# Publisher service URL
publisher_url = "http://localhost:8080"
# Explorer URL (user-facing, for linking from the faucet UI)
explorer_url = "http://localhost:3000"
