# Publisher configuration for signet (public testnet)

# Bitcoin RPC configuration (local signet node)
rpc_url = "http://localhost:38332"
rpc_user = "user"
rpc_pass = "password"
rpc_wallet = "coins-publisher"

# Subchain file
subchain = ".data/subchains/subchain_signet.bin"

# Bitcoin secret key for fee payments
keyfile = ".data/keys/publisher_signet_sk.hex"

# Mining interval (60s for signet's ~1 min blocks)
interval = 60

# Network
network = "signet"

# Genesis account
genesis_pk = "43878a2a65c154d604cbe7d974d5dad1c63ce4dc2a68f697c45a4a3ef9ab8a21"
genesis_balance = 1000000000000

# Publishing configuration
# Format: "op_return" (default), "taproot_annex", or "dual"
# - op_return: Standard relay, higher fees (proven, works everywhere)
# - taproot_annex: 75% cheaper fees via witness discount (may need custom relay)
# - dual: Broadcast both formats simultaneously (optimistic, 2x cost)
publish_format = "op_return"

# Fee rate in satoshis per virtual byte (default: 4)
fee_rate_sat_per_vb = 4

# For dual mode only: which format to track as primary anchor
# Options: "op_return" or "taproot_annex" (default: "op_return")
# dual_primary = "op_return"
